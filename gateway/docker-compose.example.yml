# Optional: run go2rtc in Docker on the home server.
# Copy to docker-compose.yml, set RTSP URL, then: docker compose up -d
# Gateway still runs via: cd gateway && npm start  (GO2RTC_BASE=http://127.0.0.1:1984)

services:
  go2rtc:
    image: alexxit/go2rtc
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
